version: '3.4'

services:
  mongodb:
    container_name: mongodb
    image: mongo:7
    ports:
      - "27017:27017"

  shoppingcart.database:
    image: postgres:16-alpine
    container_name: shoppingcart.database
    environment:
      - POSTGRES_DB=ShoppingCart
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=test
    ports:
      - 5432:5432
  
  shoppingcart.cache:
    image: redis:7-alpine
    restart: always
    ports:
      - 6379:6379
  
  discount.database:
    image: mysql:8.0
    container_name: discount.database
    environment:
      - MYSQL_ROOT_PASSWORD=123
    ports:
      - 3306:3306

  ordering.database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ordering.database
    environment:
      - SA_PASSWORD= 1234
      - ACCEPT_EULA= Y
      - MSSQL_PID= Express
    restart: always
    ports:
      - 1433:1433
   
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
   
  ecommerce.webapi:
    container_name: ecommerce.webapi
    image: ${DOCKER_REGISTRY-}ecommercewebapi
    build:
      context: .
      dockerfile: Services/ProductCatalog/WebAPI/ECommerce.WebAPI/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - mongodb

  shoppingcart.webapi:
    image: ${DOCKER_REGISTRY-}shoppingcartwebapi
    container_name: shoppingcart.webapi
    build:
      context: .
      dockerfile: Services/ShoppingCart/WebAPI/ShoppingCart.WebAPI/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # - ASPNETCORE_HTTP_PORTS=8080
      - "EventBusSettings:HostAddress=amqp://guest:guest@rabbitmq:5672" 
    ports:
      - 8081:8080
    depends_on:
      - shoppingcart.database
      - rabbitmq

  discount.api:
    image: ${DOCKER_REGISTRY-}discountapi
    container_name: discount.api
    environment:
      - "GrpcSettings:DiscountUrl=http://discount.grpc"
    build:
      context: .
      dockerfile: Services/Discount/Discount.API/Dockerfile
    ports:
      - 8082:8080
    depends_on:
      - discount.database


  discount.grpc:
    image: ${DOCKER_REGISTRY-}discountgrpc
    container_name: discount.grpc
    build:
      context: .
      dockerfile: Services/Discount/Discount.Grpc/Dockerfile
    ports:
      - 8083:8080
    depends_on:
      - discount.database

  order.api:
    image: ${DOCKER_REGISTRY-}orderapi
    container_name: order.api
    build:
      context: .
      dockerfile: Services/Ordering/WebAPI/Order.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # - ASPNETCORE_HTTP_PORTS=8080
      - "ConnectionStrings:OrderConnectionString=Server=ordering.database;Database=OrderDb;User Id=sa;Password=1234"
      - "EventBusSettings:HostAddress=amqp://guest:guest@rabbitmq:5672"
    depends_on:
      - ordering.database
      - rabbitmq
    ports:
      - "8084:8080"

  apigateway:
    image: ${DOCKER_REGISTRY-}apigateway
    container_name: apigateway
    build:
      context: .
      dockerfile: ApiGateways/ApiGateway/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - ecommerce.webapi
      - shoppingcart.webapi
      - discount.api
      - order.api
    ports:
      - "8085:8080"

