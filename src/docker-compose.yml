  shoppingcart.database:
    image: postgres:latest
    container_name: shoppingcart.database
    environment:
      - POSTGRES_DB=ShoppingCart
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=test
    ports:
      - 5432:5432
  
  shoppingcart.cache:
    image: redis:latest
    restart: always
    ports:
      - 6379:6379
  
  shoppingcart.webapi:
    image: ${DOCKER_REGISTRY-}shoppingcartwebapi
    container_name: shoppingcart.webapi
    build:
      context: .
      dockerfile: Services/ShoppingCart/WebAPI/ShoppingCart.WebAPI/Dockerfile
    ports:
      - 8080:8080
    depends_on:
      - shoppingcart.database
  
  

